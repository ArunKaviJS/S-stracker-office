image: python:3.12

pipelines:
  default:
    - step:
        name: "Deploy Lambda Function"

        script:

          # Install zip
          - apt-get update
          - apt-get install -y zip

          # Install dependencies
          - pip install -r requirements.txt -t .

          # Install AWS CLI
          - pip install awscli

          # Remove old ZIP
          - rm -f code.zip

          # Create ZIP
          - zip -r code.zip . -x "*.git*" "__pycache__/*" "*.pyc"

          # Verify ZIP exists
          - ls -lh

          # Upload ZIP to S3
          - aws s3 cp code.zip s3://s-tracker-kpi-insights/code.zip

          # Deploy Lambda
          - aws lambda update-function-code \
              --function-name Automated_KPI_Insights \
              --s3-bucket s-tracker-kpi-insights \
              --s3-key code.zip \
              --region ap-south-1