image: python:3.12

pipelines:
  default:
    - step:
        name: "Deploy Lambda Function"

        script:

          - apt-get update
          - apt-get install -y zip

          - pip install -r requirements.txt -t .

          - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY
          - export AWS_DEFAULT_REGION=ap-south-1

          - rm -f code.zip

          - zip -r code.zip . -x "*.git*" "__pycache__/*" "*.pyc"

          - ls -lh

          - aws s3 cp code.zip s3://s-tracker-kpi-insights/code.zip

          - aws lambda update-function-code \
              --function-name Automated_KPI_Insights \
              --s3-bucket s-tracker-kpi-insights \
              --s3-key code.zip \
              --region ap-south-1