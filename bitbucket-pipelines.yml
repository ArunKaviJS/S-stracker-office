image: python:3.12

pipelines:
  default:
    - step:
        name: "Deploy Lambda Function"

        script:

          - apt-get update
          - apt-get install -y zip unzip curl

          # Install AWS CLI
          - pip install awscli

          # Install dependencies
          - pip install -r requirements.txt -t .

          # AWS Credentials
          - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY
          - export AWS_DEFAULT_REGION=ap-southeast-1

          # Create deployment zip
          - rm -f code.zip
          - zip -r code.zip . -x "*.git*" "__pycache__/*" "*.pyc"

          # Upload to S3
          - aws s3 cp code.zip s3://ai-stracker-kpi-insights/code.zip

          # Deploy to Lambda
          - aws lambda update-function-code --function-name KPI_Insights --s3-bucket ai-stracker-kpi-insights --s3-key code.zip --region ap-southeast-1