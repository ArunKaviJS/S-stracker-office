image: python:3.12

pipelines:
  default:
    - step:
        name: "Deploy Lambda Function"

        script:

          # Install zip
          - apt-get update
          - apt-get install -y zip

          # Install Dependencies
          - pip install -r requirements.txt -t .

          # Create ZIP
          - zip -r code.zip . -x "*.git*" "__pycache__/*" "*.pyc"

          # Verify ZIP Exists
          - ls -lh

          # Upload ZIP to S3
          - pipe: atlassian/aws-s3-deploy:1.1.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_KEY
              AWS_DEFAULT_REGION: "ap-south-1"

              S3_BUCKET: "s-tracker-kpi-insights"

              LOCAL_PATH: "code.zip"

          # Deploy Lambda
          - pipe: atlassian/aws-lambda-deploy:1.7.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_KEY
              AWS_DEFAULT_REGION: "ap-south-1"

              FUNCTION_NAME: "Automated_KPI_Insights"

              COMMAND: "update"

              S3_BUCKET: "s-tracker-kpi-insights"

              S3_KEY: "code.zip"